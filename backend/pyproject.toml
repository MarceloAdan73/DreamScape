[project]
name = "dreamscape-backend"
version = "0.1.0"
description = "DreamScape backend: diario de sueños con análisis por IA local (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Dependencias de la capa IA (Fase 2). Se separan para poder correr la Fase 1
# sin la dependencia pesada de ChromaDB.
ai = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query` en defaults son el patrón idiomático de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true
exclude = ["(\\.venv|build|dist)/"]

[[tool.mypy.overrides]]
module = ["chromadb.*", "faster_whisper.*"]
ignore_missing_imports = true
